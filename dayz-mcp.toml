# Переносна половина профілю для dayz-agentic-modding-mcp.
# Машинні шляхи живуть у dayz-mcp.local.toml, який не комітиться.
#
# Фракції ЖОРСТКО залежать від @OpenZone_Core через requiredAddons, а дві
# склейки -- ще й від @OpenZone_PDA та @OpenZone_VPP відповідно. Усі сусіди
# підставляються стенду через [mods] extra у локальному файлі. Без моста
# фракцій не буває: звання, ростер і лідерство живуть у базі бота.

[project]
name = "openzone-factions"

[build]
# Порядок значущий: склейки жорстко вимагають базовий мод, і пакувати їх
# раніше за нього немає сенсу. Джерела в <root>/OpenZone_Factions,
# <root>/OpenZone_Factions_PDA (вкладка «Фракція» в КПК) і
# <root>/OpenZone_Factions_VPP (панель FACTIONS в адмінці).
mods = ["OpenZone_Factions", "OpenZone_Factions_PDA", "OpenZone_Factions_VPP"]
# The layout generator reads its tokens from the core REPOSITORY: design
# tokens are a platform concern (openzone-core/ui/tokens.json), and the
# faction page is also the right half of a tab whose left half is drawn by
# OpenZone_PDA -- two halves of one screen cannot own two palettes, so both
# repositories read the very same file instead of one owning a copy for the
# other. Descriptions stay here (ui/OpenZone_Factions_PDA/), the numbers
# they name come from there.
#
# The path is relative to this file, not absolute: `tokens` is a portable
# key -- the loader refuses a [build] section in dayz-mcp.local.toml -- so a
# machine path could not live in the half of the profile that is meant for
# machine paths. Relative works for anyone who checks the series out the way
# it is laid out, side by side under one directory.
# No `sources`: every mod's config.cpp sits in <root>/<Mod>, the default.
tokens = "../openzone-core/ui/tokens.json"

[expect]
# Рядок, який мод друкує, коли фракції прочитані (OZF_Module).
ready_line   = "factions loaded"
max_warnings = 0
forbid       = ["Bad type", "Can't compile", "NULL pointer to instance"]
# Помилки рушія про наші класи і помилки, які друкує сам мод (OZ_Log.Error
# пише звичайним `SCRIPT :` із префіксом `[OpenZone] ERROR:`).
error_regex  = ["SCRIPT\\s+\\(E\\).*OZF_", "\\[OpenZone\\] ERROR"]
# Стенд ходить до моста по http на 127.0.0.1, і ядро чесно попереджає про це
# кожен бут; на локальному стенді це стан, а не подія.
noise        = ["Bridge.Url is not https", "module class \"OZ_Module_Radio\" is not in CfgVehicles", "factions settings: no Faction section in the core config or its backup"]
# The second line: the PDA profiles of the stand name the radio module and this
# stand carries no radio -- a fact of the stand, not of this mod. The third: the
# one-time migration of the invitation lifetime warns on a clean install where
# nothing was ever lost; the admin reads it in the log, the verdict does not fail.

# No counter for the faction count: the ready line prints how many factions the
# server read from its own $profile:OpenZone\OZ_Core_Factions.json -- nine on this
# stand, ten from LoadDefaults on a fresh profile -- and a number that depends on
# the server's data file is not a fact the build can promise. The ready line
# still proves the load; the number is read by eye in the log.

[client]
# The client runs with -filePatching and mod_build keeps @<Mod>/<Mod> as a junction
# to the source tree, so an edited .layout is read without repacking (the stand
# config already carries allowFilePatching = 1).
file_patching = true
